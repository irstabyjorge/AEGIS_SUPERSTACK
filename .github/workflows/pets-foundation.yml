name: PETS Foundation Tests

on:
  push:
    branches:
      - aegis-pets-cloud-integration
  pull_request:
    branches:
      - main
      - aegis-pets-cloud-integration

permissions:
  contents: read

jobs:
  pets-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile PETS modules
        run: python -m compileall -q modules/pets
      - name: Run PETS foundation tests
        run: python -m unittest discover -s tests -p "test_pets_foundation.py" -v
