name: Sacred Atom Multi-Agent and Geometry Tests

on:
  push:
    branches:
      - feat/sacred-atom-geometry-adapter
    paths:
      - "modules/pets/sacred_atom_*.py"
      - "tests/test_sacred_atom_*.py"
      - ".github/workflows/sacred-atom-agents.yml"
  pull_request:
    branches:
      - main
    paths:
      - "modules/pets/sacred_atom_*.py"
      - "tests/test_sacred_atom_*.py"
      - ".github/workflows/sacred-atom-agents.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Sacred Atom modules
        run: python -m py_compile modules/pets/sacred_atom_agents.py modules/pets/sacred_atom_geometry.py modules/pets/sacred_atom_integration.py
      - name: Run Sacred Atom unit tests
        run: python -m unittest discover -s tests -p "test_sacred_atom_*.py" -v
