name: PETS Universal Formula Engine Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "modules/pets/universal_formula/**"
      - "tests/test_universal_formula_engine.py"
      - "tests/test_sacred_atom_worker_pool.py"
      - "tests/test_universal_formula_objective.py"
      - "tests/test_universal_formula_runtime.py"
      - "tests/test_universal_formula_review_hardening.py"
      - "tests/test_universal_formula_durable_queue.py"
      - "tests/test_universal_formula_value_ledger.py"
      - "tests/test_universal_formula_cosmic_system.py"
      - "tests/test_universal_formula_runtime_factory.py"
      - "tests/test_universal_formula_unified_graph.py"
      - "tests/test_universal_formula_durable_graph_store.py"
      - ".github/workflows/universal-formula-engine.yml"
  push:
    branches: [feat/universal-formula-25-worker-engine]
    paths:
      - "modules/pets/universal_formula/**"
      - "tests/test_universal_formula_engine.py"
      - "tests/test_sacred_atom_worker_pool.py"
      - "tests/test_universal_formula_objective.py"
      - ".github/workflows/universal-formula-engine.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Universal Formula modules
        run: python -m py_compile modules/pets/universal_formula/*.py
      - name: Run Universal Formula tests
        run: python -m unittest tests.test_universal_formula_engine tests.test_sacred_atom_worker_pool tests.test_universal_formula_objective tests.test_universal_formula_runtime tests.test_universal_formula_review_hardening tests.test_universal_formula_durable_queue tests.test_universal_formula_value_ledger tests.test_universal_formula_cosmic_system tests.test_universal_formula_runtime_factory tests.test_universal_formula_unified_graph tests.test_universal_formula_durable_graph_store -v
