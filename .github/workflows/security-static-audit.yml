name: AEGIS Read-only Security Baseline

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - "tools/security_static_audit.py"
      - ".github/workflows/security-static-audit.yml"
  push:
    branches: ["security/**"]
    paths:
      - "**/*.py"
      - "tools/security_static_audit.py"
      - ".github/workflows/security-static-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegis-security-static-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run read-only AST security audit
        run: |
          python tools/security_static_audit.py --root . --output "${RUNNER_TEMP}/security-static-audit.json"
      - name: Upload audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aegis-security-static-audit-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/security-static-audit.json
          if-no-files-found: error
          retention-days: 30
