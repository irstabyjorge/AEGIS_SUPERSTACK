name: AEGIS PETS Cloud Control Plane Tests

on:
  push:
    branches:
      - aegis-pets-cloud-integration
  pull_request:
    branches:
      - main
      - aegis-pets-cloud-integration

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile control plane
        run: python -m py_compile cloud_control_plane.py
      - name: Run isolated control-plane tests
        run: python -m unittest discover -s tests -v
