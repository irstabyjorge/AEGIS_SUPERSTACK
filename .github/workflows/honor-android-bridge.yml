name: AEGIS Android and Recovery CI
on:
  push:
    branches:
      - aegis-pets-cloud-integration
    paths:
      - "android/honor-local-bridge/**"
      - "recovery/unified-knowledge-v5_1_1/**"
      - ".github/workflows/honor-android-bridge.yml"
  pull_request:
    paths:
      - "android/honor-local-bridge/**"
      - "recovery/unified-knowledge-v5_1_1/**"
      - ".github/workflows/honor-android-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack Honor bridge source
        id: bridge
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, shutil, zipfile
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / ".aegis-honor-bridge"
          root.mkdir(parents=True, exist_ok=True)
          encoded = pathlib.Path("android/honor-local-bridge/bridge-source.zip.b64").read_text().strip()
          archive = root / "bridge.zip"
          try:
              archive.write_bytes(base64.b64decode(encoded, validate=True))
              with zipfile.ZipFile(archive) as z:
                  base = root.resolve()
                  for info in z.infolist():
                      name = info.filename
                      rel = pathlib.PurePosixPath(name)
                      # The source bundle contains its own GitHub workflow templates.
                      # They are not required to build the Android app and can collide
                      # with platform-specific metadata on extraction, so omit them.
                      if rel.parts and rel.parts[0] == "AEGIS_HONOR_LOCAL_BRIDGE" and len(rel.parts) > 1 and rel.parts[1] == ".github":
                          continue
                      if rel.is_absolute() or ".." in rel.parts or any(ord(c) < 32 for c in name):
                          raise ValueError(f"unsafe archive member path: {name!r}")
                      target = (root / pathlib.Path(*rel.parts)).resolve()
                      if not target.is_relative_to(base):
                          raise ValueError(f"archive member escapes extraction root: {name!r}")
                      if info.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                          continue
                      target.parent.mkdir(parents=True, exist_ok=True)
                      try:
                          with z.open(info) as source, target.open("wb") as destination:
                              shutil.copyfileobj(source, destination)
                      except (OSError, zipfile.BadZipFile) as exc:
                          # The embedded bundle has at least one malformed local
                          # file header. Skip that member, report it, and let the
                          # explicit manifest/Gradle checks below decide whether
                          # the remaining source is sufficient to build.
                          print(f"::warning::Skipping unreadable archive member {name!r}: {type(exc).__name__}: {exc}")
                          try:
                              target.unlink(missing_ok=True)
                          except OSError:
                              pass
          except (ValueError, OSError, zipfile.BadZipFile, EOFError) as exc:
              raise SystemExit(
                  "Honor source bundle could not be safely extracted. "
                  f"Diagnostic: {type(exc).__name__}: {exc}"
              )
          bridge = root / "AEGIS_HONOR_LOCAL_BRIDGE"
          project = bridge / "android/honor-local-bridge"
          if not (project / "app/src/main/AndroidManifest.xml").is_file():
              raise SystemExit("Android bridge source missing from archive")
          if not any(project.glob("*.gradle*")) and not (project / "gradle/wrapper/gradle-wrapper.properties").is_file():
              raise SystemExit("Android Gradle project files missing from archive")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"bridge_dir={bridge}\n")
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Run after extraction into GITHUB_WORKSPACE so setup-gradle can detect
      # the actual Gradle project and compute a valid cache key.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-provider: basic

      - name: Enforce local-only permissions
        env:
          BRIDGE_DIR: ${{ steps.bridge.outputs.bridge_dir }}
        run: python3 "$BRIDGE_DIR/tools/verify_local_only.py"

      - name: Unit tests and debug APK
        env:
          BRIDGE_DIR: ${{ steps.bridge.outputs.bridge_dir }}
        run: gradle -p "$BRIDGE_DIR/android/honor-local-bridge" testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: aegis-honor-local-bridge-debug-apk
          path: ${{ steps.bridge.outputs.bridge_dir }}/android/honor-local-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  recovered-knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test recovered knowledge engine
        run: python -m unittest discover -s tests -p "test_knowledge_engines.py" -v
