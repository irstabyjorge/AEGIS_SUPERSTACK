name: Railway Foundation Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "railway_app/**"
      - "Dockerfile"
      - "RAILWAY_DEPLOYMENT.md"
      - ".github/workflows/railway-foundation.yml"
  push:
    branches: [feat/railway-safe-foundation]
    paths:
      - "railway_app/**"
      - "Dockerfile"
      - ".github/workflows/railway-foundation.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install minimal app dependencies
        run: python -m pip install -r railway_app/requirements.txt
      - name: Run security and health tests
        run: python -m unittest railway_app.test_main -v
