name: Railway Foundation Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "railway_app/**"
      - "modules/api_server.py"
      - "qbyte_engine.py"
      - "tests/**"
      - "config.example.yaml"
      - "modules/pets/universal_formula/**"
      - "modules/pets/sacred_atom_agents.py"
      - "Dockerfile"
      - "RAILWAY_DEPLOYMENT.md"
      - ".github/workflows/railway-foundation.yml"
  push:
    branches: [feat/railway-safe-foundation]
    paths:
      - "railway_app/**"
      - "modules/api_server.py"
      - "qbyte_engine.py"
      - "tests/**"
      - "config.example.yaml"
      - "modules/pets/universal_formula/**"
      - "modules/pets/sacred_atom_agents.py"
      - "Dockerfile"
      - ".github/workflows/railway-foundation.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install minimal app dependencies
        run: python -m pip install -r railway_app/requirements.txt
      - name: Install lint tool
        run: python -m pip install ruff
      - name: Format check for new test modules
        run: ruff format --check tests/test_api_server.py tests/test_qbyte_engine.py
      - name: Lint changed Python modules
        run: ruff check --select E4,E7,E9 modules/api_server.py qbyte_engine.py railway_app tests/test_api_server.py tests/test_qbyte_engine.py
      - name: Compile application, formula, and test modules
        run: python -m compileall -q modules/api_server.py qbyte_engine.py modules/pets/universal_formula modules/pets/sacred_atom_agents.py railway_app tests
      - name: Import smoke tests
        run: python -c "import qbyte_engine; import railway_app.main"
      - name: Run API, QByte, and Universal Formula tests
        run: python -m unittest railway_app.test_main tests.test_qbyte_engine tests.test_api_server tests.test_universal_formula_engine tests.test_universal_formula_objective tests.test_universal_formula_runtime tests.test_universal_formula_review_hardening tests.test_universal_formula_durable_queue tests.test_universal_formula_durable_graph_store tests.test_sacred_atom_agents tests.test_sacred_atom_integration -v
      - name: Build Railway Docker image
        run: docker build --pull -t aegis-api-foundation:test .
