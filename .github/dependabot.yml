version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Tijuana"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automation"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "America/Tijuana"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "npm"
    directory: "/sovereign-ai"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Tijuana"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
